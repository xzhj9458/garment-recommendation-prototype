<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>穿搭推荐单文件版</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f3f5f2;
  --surface: #ffffff;
  --surface-muted: #f7f8f6;
  --surface-strong: #edf1ec;
  --border: #d9ded8;
  --border-strong: #bfc7bf;
  --text: #1e2521;
  --text-soft: #58615b;
  --text-muted: #7a837d;
  --green: #285f4b;
  --green-dark: #1d4738;
  --green-soft: #e1ece6;
  --red: #9b423e;
  --red-soft: #f5e6e4;
  --amber: #8a6420;
  --amber-soft: #f5eddc;
  --blue: #406773;
  --blue-soft: #e5eef0;
  --shadow: 0 8px 24px rgba(32, 42, 36, 0.07);
  --radius: 6px;
  --header-height: 58px;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button,
a,
select,
input,
textarea {
  outline: none;
}

button,
select,
input[type="checkbox"],
input[type="file"] {
  cursor: pointer;
}

button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid #467b67;
  outline-offset: 2px;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3,
p {
  margin: 0;
}

button {
  border: 0;
  background: none;
}

.app-header {
  position: sticky;
  z-index: 30;
  top: 0;
  height: var(--header-height);
  display: grid;
  grid-template-columns: minmax(190px, 1fr) auto minmax(310px, 1fr);
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 1px 0 rgba(22, 34, 27, 0.03);
}

.brand {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border-radius: 5px;
  color: #fff;
  background: var(--green);
  font-size: 16px;
  font-weight: 700;
}

.brand > span:last-child {
  display: grid;
  gap: 1px;
}

.brand strong {
  font-size: 15px;
  line-height: 1.2;
}

.brand small {
  color: var(--text-muted);
  font-size: 11px;
}

.page-nav {
  align-self: stretch;
  display: flex;
  align-items: stretch;
  gap: 6px;
}

.page-nav a {
  position: relative;
  display: grid;
  min-width: 96px;
  place-items: center;
  padding: 0 16px;
  color: var(--text-soft);
  font-weight: 600;
}

.page-nav a::after {
  position: absolute;
  right: 16px;
  bottom: 0;
  left: 16px;
  height: 3px;
  background: transparent;
  content: "";
}

.page-nav a:hover,
.page-nav a.is-active {
  color: var(--green-dark);
}

.page-nav a.is-active::after {
  background: var(--green);
}

.header-actions {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 8px;
}

.version-chip,
.save-state {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-soft);
  background: var(--surface-muted);
  font-size: 12px;
}

.save-state.is-dirty {
  border-color: #e0c98e;
  color: var(--amber);
  background: var(--amber-soft);
}

.icon-button {
  display: inline-grid;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-soft);
  background: var(--surface);
  font-size: 17px;
  line-height: 1;
}

.icon-button:hover {
  border-color: var(--border-strong);
  color: var(--green-dark);
  background: var(--surface-muted);
}

.icon-button.is-danger:hover {
  border-color: #dbaca8;
  color: var(--red);
  background: var(--red-soft);
}

.primary-button,
.secondary-button,
.detail-button,
.text-button {
  min-height: 34px;
  border-radius: 4px;
  font-weight: 600;
}

.primary-button {
  padding: 0 15px;
  color: #fff;
  background: var(--green);
}

.primary-button:hover {
  background: var(--green-dark);
}

.secondary-button {
  padding: 0 12px;
  border: 1px solid var(--border);
  color: var(--text-soft);
  background: var(--surface);
}

.secondary-button:hover {
  border-color: var(--green);
  color: var(--green-dark);
}

.text-button {
  min-height: 28px;
  padding: 0 5px;
  color: var(--green);
  background: transparent;
  font-size: 12px;
}

.text-button:hover {
  text-decoration: underline;
}

.section-kicker {
  color: var(--green);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

.demo-main {
  width: min(1540px, calc(100% - 32px));
  margin: 16px auto 36px;
}

.demo-top-grid {
  display: grid;
  grid-template-columns: minmax(390px, 0.78fr) minmax(640px, 1.22fr);
  gap: 14px;
  min-height: 366px;
}

.surface {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.surface-header {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
}

.surface-header h1,
.surface-header h2,
.recommendation-heading h2 {
  margin-top: 2px;
  font-size: 18px;
  line-height: 1.25;
}

.source-badge,
.calculation-state {
  flex: 0 0 auto;
  padding: 4px 8px;
  border-radius: 4px;
  color: var(--green-dark);
  background: var(--green-soft);
  font-size: 11px;
  font-weight: 700;
}

.calculation-state.is-working {
  color: var(--amber);
  background: var(--amber-soft);
}

.input-tabs {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  border-bottom: 1px solid var(--border);
  background: var(--surface-muted);
}

.input-tabs button {
  min-width: 0;
  height: 38px;
  padding: 0 6px;
  overflow: hidden;
  color: var(--text-muted);
  border-right: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.input-tabs button:last-child {
  border-right: 0;
}

.input-tabs button:hover,
.input-tabs button.is-active {
  color: var(--green-dark);
  background: var(--surface);
}

.input-tabs button.is-active {
  box-shadow: inset 0 -3px 0 var(--green);
}

.input-content {
  min-height: 268px;
  max-height: 320px;
  overflow: auto;
  padding: 14px 16px 12px;
}

.input-group-heading {
  display: flex;
  min-width: 0;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 13px;
}

.input-group-heading strong {
  display: block;
  font-size: 14px;
}

.input-group-heading p {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 11px;
  line-height: 1.5;
}

.upload-button {
  display: inline-flex;
  max-width: 160px;
  min-height: 30px;
  flex: 0 0 auto;
  align-items: center;
  gap: 5px;
  padding: 0 9px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--green-dark);
  background: var(--surface-muted);
  font-size: 11px;
  font-weight: 600;
}

.upload-button span:last-of-type {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.field-stack-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.field-stack-grid--single {
  grid-template-columns: 1fr;
}

.field-stack-grid--preference {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 10px;
}

.input-content.is-preference .input-group-heading {
  margin-bottom: 8px;
}

.input-content.is-preference .trend-input-summary {
  margin-top: 4px;
}

.input-content.is-preference .source-line {
  margin-top: 7px;
}

.field-control,
.scale-control {
  display: grid;
  min-width: 0;
  gap: 6px;
}

.field-control > span,
.scale-label span {
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 700;
}

.field-control select,
.compact-select,
.editor-field input,
.editor-field select,
.editor-field textarea,
.test-field select,
.list-filter-row select,
.search-box input {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  background: var(--surface);
}

.field-control select {
  height: 34px;
  padding: 0 9px;
}

.field-control small,
.editor-field small {
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.4;
}

.scale-control {
  padding-bottom: 8px;
  border-bottom: 1px solid #edf0ec;
}

.scale-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.scale-label strong {
  color: var(--green-dark);
  font-size: 11px;
}

.segment-control {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 4px;
}

.segment-control--4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.segment-control--2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.field-stack-grid--preference .segment-control--7 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.segment-control--6 {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}

.choice-control > small {
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.4;
}

.segment-control button {
  min-width: 0;
  min-height: 31px;
  padding: 3px 4px;
  overflow-wrap: anywhere;
  border-right: 1px solid var(--border);
  color: var(--text-muted);
  background: var(--surface);
  font-size: 9px;
  line-height: 1.15;
}

.segment-control button:last-child {
  border-right: 0;
}

.segment-control button:hover,
.segment-control button.is-active {
  color: var(--green-dark);
  background: var(--green-soft);
}

.segment-control button.is-active {
  box-shadow: inset 0 -2px 0 var(--green);
  font-weight: 700;
}

.color-matrix {
  min-width: 0;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 4px;
}

.appearance-part-tabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-bottom: 11px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 4px;
}

.appearance-part-tabs button {
  min-height: 31px;
  border-right: 1px solid var(--border);
  color: var(--text-muted);
  background: var(--surface);
  font-size: 11px;
  font-weight: 600;
}

.appearance-part-tabs button:last-child {
  border-right: 0;
}

.appearance-part-tabs button:hover,
.appearance-part-tabs button.is-active {
  color: var(--green-dark);
  background: var(--green-soft);
}

.appearance-part-tabs button.is-active {
  box-shadow: inset 0 -2px 0 var(--green);
}

.appearance-scales {
  display: grid;
  gap: 8px;
}

.matrix-head,
.matrix-row {
  display: grid;
  grid-template-columns: 60px repeat(3, minmax(92px, 1fr));
  align-items: center;
  gap: 8px;
  min-width: 360px;
  padding: 7px 9px;
  border-bottom: 1px solid var(--border);
}

.matrix-row:last-child {
  border-bottom: 0;
}

.matrix-head {
  color: var(--text-muted);
  background: var(--surface-muted);
  font-size: 10px;
}

.matrix-row > strong {
  font-size: 11px;
}

.compact-select {
  height: 30px;
  padding: 0 5px;
  font-size: 10px;
}

.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.check-control {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  align-items: flex-start;
  gap: 8px;
  min-height: 54px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.check-control input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.check-box {
  display: grid;
  width: 18px;
  height: 18px;
  place-items: center;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  color: transparent;
  background: var(--surface);
  font-size: 11px;
  pointer-events: none;
}

.check-control > span:last-child {
  pointer-events: none;
}

.check-control input:checked + .check-box {
  border-color: var(--green);
  color: #fff;
  background: var(--green);
}

.check-control strong,
.check-control small {
  display: block;
}

.check-control strong {
  font-size: 11px;
}

.check-control small {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 9px;
  line-height: 1.3;
}

.source-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
  padding-top: 9px;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 10px;
}

.source-line strong {
  color: var(--text-soft);
  text-align: right;
}

.analysis-surface {
  padding-bottom: 10px;
}

.analysis-header {
  border-bottom: 0;
}

.change-summary {
  min-height: 52px;
  margin: 0 14px 10px;
  padding: 9px 11px;
  border: 1px solid #bdd3c6;
  border-left: 4px solid var(--green);
  border-radius: 4px;
  background: #f3f8f5;
}

.change-summary.is-no-impact {
  border-color: #ccd6d9;
  border-left-color: var(--blue);
  background: var(--blue-soft);
}

.change-summary-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
}

.change-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: var(--green);
}

.change-summary p {
  margin: 3px 0 0 14px;
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.4;
}

.change-diff-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin: 5px 0 0 14px;
  font-size: 10px;
}

.change-diff-list span {
  white-space: nowrap;
}

.change-diff-list del {
  color: var(--text-muted);
}

.change-diff-list b {
  color: var(--green-dark);
}

.analysis-columns {
  display: grid;
  grid-template-columns: minmax(320px, 1.1fr) minmax(260px, 0.9fr);
  gap: 10px 14px;
  padding: 0 14px;
}

.analysis-block {
  min-width: 0;
}

.analysis-block--wide {
  grid-column: 1 / -1;
}

.block-title {
  display: flex;
  min-height: 26px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}

.block-title span {
  font-size: 12px;
  font-weight: 700;
}

.block-title small {
  color: var(--text-muted);
  font-size: 9px;
}

.fact-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 14px;
}

.fact-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 1px 8px;
  min-height: 34px;
  padding: 5px 0;
  border-bottom: 1px solid #edf0ec;
}

.fact-item span {
  color: var(--text-soft);
  font-size: 10px;
}

.fact-item strong {
  font-size: 11px;
}

.fact-item small {
  grid-column: 1 / -1;
  color: var(--text-muted);
  font-size: 8px;
}

.fact-item.is-unverified strong {
  color: var(--amber);
}

.reason-list {
  display: grid;
  gap: 5px;
  max-height: 140px;
  margin: 7px 0 0;
  padding: 0;
  overflow: auto;
  list-style: none;
}

.reason-list li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: flex-start;
  gap: 7px;
}

.reason-list p {
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.4;
}

.rule-status {
  padding: 2px 5px;
  border-radius: 3px;
  color: var(--text-soft);
  background: var(--surface-strong);
  font-size: 8px;
  font-style: normal;
  font-weight: 700;
}

.rule-status.is-hard {
  color: var(--red);
  background: var(--red-soft);
}

.soft-rule-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 14px;
  margin-top: 7px;
}

.soft-rule-item {
  min-width: 0;
  padding-left: 8px;
  border-left: 2px solid #95b4a6;
}

.soft-rule-item span {
  font-size: 10px;
  font-weight: 700;
}

.soft-rule-item p {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 9px;
  line-height: 1.35;
}

.recommendation-section {
  margin-top: 16px;
}

.recommendation-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  padding: 0 2px 9px;
}

.recommendation-heading p:last-child {
  color: var(--text-muted);
  font-size: 11px;
}

.candidate-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 14px;
}

.candidate-card {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--border);
  border-top: 3px solid var(--green);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.candidate-card[data-family="soft"] {
  border-top-color: #8d6657;
}

.candidate-card[data-family="relaxed"] {
  border-top-color: var(--blue);
}

.candidate-card[data-family="tailored"] {
  border-top-color: #3f4341;
}

.candidate-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.candidate-number {
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
}

.candidate-card h3 {
  margin-top: 2px;
  font-size: 15px;
}

.palette-strip {
  display: flex;
  flex: 0 0 auto;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 3px;
}

.palette-strip span {
  width: 18px;
  height: 26px;
}

.palette-summary {
  display: grid;
  gap: 3px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--border);
}

.palette-summary span,
.palette-summary small {
  color: var(--text-muted);
  font-size: 9px;
}

.palette-summary strong {
  color: var(--text-soft);
  font-size: 11px;
}

.palette-summary small {
  line-height: 1.4;
}

.outfit-detail-summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 12px;
  margin-top: 10px;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.outfit-detail-summary span {
  display: grid;
  min-width: 0;
  gap: 2px;
}

.outfit-detail-summary small {
  color: var(--text-muted);
  font-size: 8px;
}

.outfit-detail-summary strong {
  overflow-wrap: anywhere;
  font-size: 9px;
}

.expected-effect {
  min-height: 50px;
  margin-top: 10px;
  padding: 8px 9px;
  border-left: 3px solid var(--green);
  color: var(--text-soft);
  background: var(--green-soft);
  font-size: 10px;
  line-height: 1.45;
}

.expected-effect b {
  display: block;
  margin-bottom: 3px;
  color: var(--green-dark);
  font-size: 9px;
}

.dialog-palette {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.dialog-palette span {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  align-items: center;
  column-gap: 7px;
  padding: 7px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.dialog-palette i {
  width: 22px;
  height: 28px;
  border: 1px solid rgba(40, 54, 45, 0.15);
  border-radius: 3px;
}

.dialog-palette small,
.dialog-palette strong {
  grid-column: 2;
}

.dialog-palette small {
  color: var(--text-muted);
  font-size: 9px;
}

.dialog-palette strong {
  font-size: 10px;
}

.garment-stack {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-top: 12px;
}

.garment-stack div {
  min-width: 0;
  min-height: 52px;
  padding: 7px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.garment-stack span,
.garment-stack strong {
  display: block;
}

.garment-stack span {
  color: var(--text-muted);
  font-size: 8px;
}

.garment-stack strong {
  margin-top: 3px;
  overflow-wrap: anywhere;
  font-size: 10px;
  line-height: 1.3;
}

.candidate-specs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  margin-top: 11px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.candidate-specs span {
  min-width: 0;
  padding: 7px 5px;
  border-right: 1px solid var(--border);
  text-align: center;
}

.candidate-specs span:last-child {
  border-right: 0;
}

.candidate-specs small,
.candidate-specs strong {
  display: block;
}

.candidate-specs small {
  color: var(--text-muted);
  font-size: 8px;
}

.candidate-specs strong {
  margin-top: 2px;
  overflow-wrap: anywhere;
  font-size: 9px;
}

.candidate-reason {
  min-height: 40px;
  margin-top: 9px;
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.45;
}

.difference-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 28px;
  margin-top: 6px;
  padding: 5px 7px;
  border-radius: 3px;
  background: var(--green-soft);
  font-size: 9px;
}

.difference-line span {
  color: var(--text-soft);
}

.difference-line strong {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--green-dark);
  text-align: right;
}

.detail-button {
  width: 100%;
  margin-top: 10px;
  border: 1px solid var(--green);
  color: var(--green-dark);
  background: var(--surface);
  font-size: 11px;
}

.detail-button:hover {
  color: #fff;
  background: var(--green);
}

.empty-result {
  padding: 28px;
  border: 1px solid #e3c7c4;
  border-radius: var(--radius);
  background: var(--red-soft);
  text-align: center;
}

.empty-result strong,
.empty-result p,
.empty-result a {
  display: block;
}

.empty-result p {
  margin: 7px auto;
  color: var(--text-soft);
}

.empty-result a {
  color: var(--green-dark);
  font-weight: 700;
}

.detail-dialog,
.confirm-dialog {
  width: min(760px, calc(100% - 28px));
  max-height: min(820px, calc(100vh - 34px));
  padding: 0;
  overflow: auto;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: 0 24px 70px rgba(22, 31, 26, 0.22);
}

.detail-dialog::backdrop,
.confirm-dialog::backdrop {
  background: rgba(26, 34, 29, 0.48);
}

.dialog-header {
  position: sticky;
  z-index: 2;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.dialog-header h2 {
  margin-top: 2px;
  font-size: 18px;
}

.dialog-section {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}

.dialog-section:last-child {
  border-bottom: 0;
}

.dialog-section h3 {
  margin-bottom: 8px;
  font-size: 12px;
}

.dialog-section > p {
  color: var(--text-soft);
  font-size: 11px;
  line-height: 1.55;
}

.dialog-garments {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 8px;
}

.dialog-garments span {
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.dialog-garments small,
.dialog-garments strong {
  display: block;
}

.dialog-garments small {
  color: var(--text-muted);
  font-size: 9px;
}

.dialog-garments strong {
  margin-top: 3px;
  font-size: 11px;
}

.evidence-list,
.verification-list,
.validation-issue-list {
  display: grid;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.evidence-list li {
  display: grid;
  grid-template-columns: minmax(110px, auto) minmax(0, 1fr);
  align-items: flex-start;
  gap: 8px;
}

code {
  color: var(--blue);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px;
  overflow-wrap: anywhere;
}

.evidence-list span {
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.45;
}

.verification-list article {
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.verification-list article > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.verification-list article strong {
  font-size: 11px;
}

.verification-list article p {
  margin-top: 5px;
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.45;
}

.impact-badge {
  padding: 2px 5px;
  border-radius: 3px;
  color: var(--green-dark);
  background: var(--green-soft);
  font-size: 8px;
  white-space: nowrap;
}

.impact-badge.is-impact {
  color: var(--red);
  background: var(--red-soft);
}

.trace-id-line code {
  display: inline-block;
  margin: 2px 3px 2px 0;
  padding: 2px 4px;
  border-radius: 3px;
  background: var(--blue-soft);
}

.muted-copy {
  color: var(--text-muted);
  font-size: 11px;
  line-height: 1.5;
}

.toast {
  position: fixed;
  z-index: 80;
  right: 18px;
  bottom: 18px;
  max-width: min(360px, calc(100% - 36px));
  padding: 10px 14px;
  border-radius: 4px;
  color: #fff;
  background: #26342c;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 160ms ease, transform 160ms ease;
  pointer-events: none;
}

.toast.is-visible {
  opacity: 1;
  transform: translateY(0);
}

/* Rule workspace */

.rules-page {
  height: 100vh;
  overflow: hidden;
}

.rules-page .app-header {
  grid-template-columns: minmax(190px, 0.8fr) auto minmax(560px, 1.2fr);
}

.rules-header-actions {
  gap: 6px;
}

.rules-main {
  height: calc(100vh - var(--header-height));
  display: grid;
  grid-template-rows: 48px minmax(0, 1fr);
}

.rules-toolbar {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.workspace-tabs {
  align-self: stretch;
  display: flex;
  align-items: stretch;
  gap: 3px;
  min-width: 0;
  overflow-x: auto;
}

.workspace-tabs button {
  display: inline-flex;
  min-width: 90px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 12px;
  color: var(--text-soft);
  border-bottom: 3px solid transparent;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.workspace-tabs button span {
  display: grid;
  min-width: 18px;
  height: 18px;
  place-items: center;
  border-radius: 9px;
  color: var(--text-muted);
  background: var(--surface-strong);
  font-size: 9px;
}

.workspace-tabs button:hover,
.workspace-tabs button.is-active {
  color: var(--green-dark);
  background: var(--surface-muted);
}

.workspace-tabs button.is-active {
  border-bottom-color: var(--green);
}

.rules-toolbar-meta {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 9px;
  color: var(--text-muted);
  font-size: 10px;
}

.rules-workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: 260px minmax(520px, 1fr) 360px;
  background: var(--surface);
}

.rules-workspace--simple {
  grid-template-columns: 300px minmax(0, 1fr);
}

.rules-workspace--simple .rule-editor-panel {
  border-right: 0;
}

.rules-workspace--simple .editor-content {
  max-width: 980px;
  width: 100%;
}

.object-list-panel,
.rule-editor-panel {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border-right: 1px solid var(--border);
  background: var(--surface);
}

.object-list-panel {
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  background: var(--surface-muted);
}

.list-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 7px;
  padding: 10px;
}

.search-box {
  position: relative;
  min-width: 0;
}

.search-box > span {
  position: absolute;
  z-index: 1;
  top: 50%;
  left: 9px;
  color: var(--text-muted);
  transform: translateY(-50%);
}

.search-box input {
  height: 32px;
  padding: 0 8px 0 28px;
  font-size: 11px;
}

.list-filter-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  padding: 0 10px 9px;
  border-bottom: 1px solid var(--border);
}

.list-filter-row select {
  height: 29px;
  padding: 0 5px;
  font-size: 10px;
}

.object-list {
  min-height: 0;
  overflow: auto;
  padding: 6px;
}

.object-list-item {
  width: 100%;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 7px;
  min-height: 54px;
  padding: 7px;
  border: 1px solid transparent;
  border-radius: 4px;
  text-align: left;
}

.object-list-item:hover {
  background: #ecefec;
}

.object-list-item.is-active {
  border-color: #aec6b9;
  background: var(--green-soft);
}

.object-state {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.object-state.is-disabled {
  background: var(--text-muted);
}

.object-state.has-error {
  background: var(--red);
}

.object-list-item strong,
.object-list-item small {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.object-list-item strong {
  font-size: 11px;
}

.object-list-item small {
  margin-top: 2px;
  color: var(--text-muted);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 8px;
}

.object-list-item em {
  max-width: 66px;
  padding: 2px 4px;
  overflow: hidden;
  border-radius: 3px;
  color: var(--text-muted);
  background: var(--surface-strong);
  font-size: 8px;
  font-style: normal;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.list-empty {
  padding: 28px 12px;
  color: var(--text-muted);
  font-size: 11px;
  text-align: center;
}

.rule-editor-panel {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}

.editor-toolbar {
  min-height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 15px;
  border-bottom: 1px solid var(--border);
}

.editor-toolbar h1 {
  margin-top: 2px;
  font-size: 14px;
  line-height: 1.25;
}

.editor-actions {
  display: flex;
  gap: 6px;
}

.editor-content {
  min-height: 0;
  overflow: auto;
  padding-bottom: 30px;
}

.editor-empty {
  display: grid;
  min-height: 260px;
  place-items: center;
  align-content: center;
  gap: 6px;
  padding: 20px;
  color: var(--text-muted);
  text-align: center;
}

.editor-empty strong {
  color: var(--text-soft);
}

.editor-section {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.advanced-details {
  margin-top: 10px;
  border-top: 1px dashed var(--border);
}

.advanced-details summary {
  padding: 8px 0 2px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 10px;
  user-select: none;
}

.advanced-details[open] summary {
  color: var(--green-dark);
}

.body-input-section + .body-input-section {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.body-input-section h3 {
  margin-bottom: 8px;
  color: var(--text-soft);
  font-size: 11px;
}

.color-preview-chip,
.reference-count {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 10px;
}

.color-preview-chip i {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: 3px;
}

.role-checkboxes {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 12px;
}

.role-checkboxes label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-soft);
  font-size: 10px;
}

.palette-editor-preview {
  display: flex;
  min-height: 62px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 4px;
}

.palette-editor-preview span {
  display: grid;
  min-width: 56px;
  align-content: center;
  justify-items: center;
  gap: 2px;
  color: #23302a;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.55);
}

.palette-editor-preview b {
  font-size: 10px;
}

.palette-editor-preview small {
  font-size: 9px;
}

.palette-role-list {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.palette-role-row {
  display: grid;
  grid-template-columns: minmax(100px, 0.8fr) minmax(150px, 1.2fr) 100px auto;
  align-items: end;
  gap: 7px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.ratio-summary {
  margin-top: 8px;
  color: var(--red);
  font-size: 10px;
}

.ratio-summary.is-valid {
  color: var(--green-dark);
}

.test-business-summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.test-business-summary > div {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.test-business-summary span {
  display: block;
  margin-bottom: 7px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
}

.test-business-summary p {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.test-business-summary b,
.test-business-summary em {
  padding: 3px 6px;
  border-radius: 3px;
  color: var(--text-soft);
  background: var(--surface-strong);
  font-size: 9px;
  font-style: normal;
}

.editor-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.editor-section-title h2 {
  font-size: 12px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 12px;
}

.editor-field {
  display: grid;
  min-width: 0;
  gap: 5px;
}

.editor-field--wide {
  margin-top: 10px;
}

.editor-field > span {
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 700;
}

.editor-field input,
.editor-field select {
  height: 32px;
  padding: 0 8px;
  font-size: 11px;
}

.editor-field textarea {
  min-height: 78px;
  padding: 7px 8px;
  resize: vertical;
  font-family: inherit;
  font-size: 11px;
  line-height: 1.45;
}

.editor-field textarea[data-edit*="test"] {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px;
}

.editor-field .has-error,
.editor-field input.has-error,
.editor-field textarea.has-error {
  border-color: var(--red);
  background: var(--red-soft);
}

.editor-check,
.switch-control {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 600;
}

.editor-check {
  min-height: 32px;
  align-self: end;
}

.switch-control input {
  position: absolute;
  opacity: 0;
}

.switch-control span {
  position: relative;
  width: 32px;
  height: 18px;
  border-radius: 9px;
  background: #b9c0bb;
  transition: background 140ms ease;
}

.switch-control span::after {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  content: "";
  transition: transform 140ms ease;
}

.switch-control input:checked + span {
  background: var(--green);
}

.switch-control input:checked + span::after {
  transform: translateX(14px);
}

.rule-row-list {
  display: grid;
  gap: 8px;
}

.rule-edit-row {
  display: grid;
  grid-template-columns: minmax(150px, 1.4fr) minmax(100px, 0.7fr) minmax(120px, 1fr) auto;
  align-items: end;
  gap: 7px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.output-result-list {
  display: grid;
  gap: 8px;
}

.output-result-row {
  display: grid;
  grid-template-columns: minmax(180px, 0.8fr) minmax(240px, 1.2fr) auto;
  align-items: end;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.garment-example-line {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  gap: 10px;
  margin-top: 12px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.garment-example-line > span {
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
}

.garment-example-line p {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.garment-example-line b {
  padding: 3px 6px;
  border-radius: 3px;
  color: var(--text-soft);
  background: var(--surface-strong);
  font-size: 9px;
}

.config-summary-list,
.component-config-list {
  display: grid;
  gap: 8px;
}

.config-summary-list > div {
  display: grid;
  gap: 3px;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.config-summary-list strong {
  color: var(--text);
  font-size: 11px;
}

.config-summary-list span {
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.5;
}

.component-config-row {
  display: grid;
  grid-template-columns: minmax(180px, 1.2fr) minmax(160px, 1fr) minmax(130px, 0.8fr);
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.editor-help {
  margin-top: 12px;
  padding: 9px 10px;
  color: var(--text-soft);
  border-left: 3px solid var(--green);
  background: var(--green-soft);
  font-size: 10px;
  line-height: 1.55;
}

.test-status,
.inline-status {
  padding: 3px 7px;
  border-radius: 3px;
  color: var(--green-dark);
  background: var(--green-soft);
  font-size: 9px;
  font-weight: 700;
}

.test-status.is-fail,
.inline-status.is-fail {
  color: var(--red);
  background: var(--red-soft);
}

.inline-status.is-pass {
  color: var(--green-dark);
  background: var(--green-soft);
}

.test-inputs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

.test-field {
  display: grid;
  gap: 4px;
}

.test-field span {

  transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
}

.impact-link-row:hover,
.impact-link-row.is-active {
  border-color: #8fb09f;
  background: #f4f8f5;
  box-shadow: inset 3px 0 0 var(--green);
}

.impact-link-row.is-changed {
  animation: relation-highlight 900ms ease;
}

.impact-capsules {
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.impact-capsules b {
  max-width: 100%;
  padding: 3px 6px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-soft);
  background: var(--surface);
  font-size: 9px;
  font-weight: 700;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.impact-capsules.is-output b {
  color: var(--green-dark);
  border-color: #b8d0c2;
  background: var(--green-soft);
}

.impact-arrow {
  color: var(--green);
  font-size: 16px;
  text-align: center;
}

.impact-required {
  padding: 2px 5px;
  border-radius: 3px;
  color: var(--red);
  background: var(--red-soft);
  font-size: 8px;
  font-style: normal;
  font-weight: 800;
}

.analysis-trace-card {
  position: relative;
  width: 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 8px;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--surface-muted);
  text-align: left;
  transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
}

.analysis-trace-card:hover,
.analysis-trace-card.is-active {
  border-color: #8fb09f;
  background: #f4f8f5;
  box-shadow: inset 3px 0 0 var(--green);
}

.analysis-trace-card.is-changed {
  animation: relation-highlight 900ms ease;
}

@keyframes relation-highlight {
  0%, 100% { background: var(--surface-muted); }
  40% { background: #dcece2; }
}

.trace-step {
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border-radius: 50%;
  color: var(--green-dark);
  background: var(--green-soft);
  font-size: 8px;
  font-weight: 800;
}

.trace-content,
.trace-content > span,
.trace-content > strong {
  min-width: 0;
}

.trace-content {
  display: grid;
  gap: 4px;
}

.trace-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.trace-meta b {
  color: var(--green-dark);
  font-size: 9px;
}

.trace-meta em {
  padding: 2px 4px;
  border-radius: 3px;
  color: var(--blue);
  background: var(--blue-soft);
  font-size: 8px;
  font-style: normal;
  font-weight: 700;
}

.trace-meta em.is-hard {
  color: var(--red);
  background: var(--red-soft);
}

.trace-content > strong {
  overflow: hidden;
  font-size: 10px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.trace-conclusion {
  color: var(--text);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.35;
}

.trace-direction {
  display: -webkit-box;
  overflow: hidden;
  color: var(--text-soft);
  font-size: 9px;
  line-height: 1.4;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.trace-impact,
.trace-applied {
  display: flex;
  min-width: 0;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  color: var(--text-soft);
  font-size: 9px;
}

.trace-impact small,
.trace-applied small {
  width: 28px;
  flex: 0 0 28px;
  color: var(--text-muted);
  font-size: 8px;
}

.trace-impact i {
  padding: 2px 4px;
  border-radius: 3px;
  background: var(--surface-strong);
  font-size: 8px;
  font-style: normal;
}

.analysis-empty {
  grid-column: 1 / -1;
  padding: 24px;
  color: var(--text-muted);
  text-align: center;
}

.analysis-empty p {
  margin-top: 4px;
  font-size: 10px;
}

.candidate-card {
  transition: opacity 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
}

.candidate-card.is-related {
  border-color: #8fb09f;
  box-shadow: 0 0 0 2px rgba(40, 95, 75, 0.12), var(--shadow);
}

.candidate-card.is-dimmed {
  opacity: 0.42;
}

.implementation-line {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  align-items: start;
  gap: 8px;
  min-height: 38px;
  margin-top: 9px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
}

.implementation-line > span {
  color: var(--text-muted);
  font-size: 9px;
}

.implementation-line p {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.implementation-line b {
  padding: 2px 5px;
  border-radius: 3px;
  color: var(--green-dark);
  background: var(--green-soft);
  font-size: 8px;
}

.implementation-list {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.implementation-list li {
  display: grid;
  grid-template-columns: minmax(150px, 0.8fr) minmax(0, 1.2fr);
  gap: 10px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-muted);
  font-size: 10px;
}

.implementation-list span {
  color: var(--text-soft);
}

/* Rule relationship workbench */

.rules-main {
  grid-template-rows: 54px minmax(0, 1fr);
}

.rules-toolbar {
  gap: 10px;
  padding: 0 12px;
}

.rule-filter-bar {
  display: flex;
  min-width: 0;
  flex: 1 1 auto;
  align-items: center;
  gap: 6px;
}

.rule-filter-bar .search-box {

}

.rule-filter-bar select {

}

.rules-toolbar-meta .secondary-button,
.rules-toolbar-meta .primary-button {
  min-height: 32px;
  padding: 0 10px;
  font-size: 10px;
}

.relationship-workspace {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(680px, 1fr) 470px;
  background: var(--surface);
}

.relationship-main {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  overflow: hidden;
  border-right: 1px solid var(--border);
}

.impact-panel,
.decision-panel {
  min-width: 0;
  background: var(--surface);
}

.impact-panel {
  padding: 10px 12px 12px;
  border-bottom: 1px solid var(--border);
}

.decision-panel {

  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
}

.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 8px;
}

.panel-heading h1,
.panel-heading h2 {

}

.panel-heading > span {

.panel-heading--compact {

.impact-matrix-wrap,
.decision-table-wrap,
.resource-table-wrap {

.matrix-cell {

.matrix-cell.has-rules {

}

.matrix-cell.has-rules:hover,

.decision-table {

}

.decision-table th,
.decision-table td {

  white-space: nowrap;
}

.decision-table th {

  z-index: 2;

  background: var(--surface-muted);

  font-weight: 700;
}

.decision-table th:nth-child(1) { width: 18%; }
.decision-table th:nth-child(2) { width: 24%; }
.decision-table th:nth-child(3) { width: 36%; }
.decision-table th:nth-child(4) { width: 58px; text-align: center; }

.decision-table th:nth-child(6) { width: 54px; text-align: center; }
.decision-table td:last-child { text-align: center; }

.decision-table td:nth-child(4) {
  text-align: center;
}

.mapping-capsules {
  min-width: 0;
  display: flex;
  gap: 3px;
  overflow: hidden;
}

.mapping-capsules b {
  flex: 0 0 auto;
  padding: 2px 5px;

  color: var(--text-soft);
  background: var(--surface-muted);
  font-size: 8px;
  font-weight: 700;
}

.mapping-capsules.is-output b {

.branch-count {

.decision-table tbody tr {

.decision-table tbody tr:hover,

.rule-name-cell {

}

.rule-name-cell strong {

  text-overflow: ellipsis;
}

.rule-name-cell small {

  padding: 2px 4px;

  color: var(--text-muted);

  white-space: nowrap;
}

.relation-state {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  border-radius: 50%;

}

.relation-state.is-disabled {

}

.relation-kind {
  display: inline-flex;
  height: 20px;
  align-items: center;
  padding: 0 6px;
  border-radius: 3px;
  color: var(--blue);
  background: var(--blue-soft);
  font-size: 8px;
  font-style: normal;
  font-weight: 700;
  white-space: nowrap;
}

.relation-kind.is-analysis {
  color: var(--green-dark);
  background: var(--green-soft);
}

.relation-kind.is-hard {
  color: var(--red);
  background: var(--red-soft);
}

.table-switch {
  display: inline-flex;
  align-items: center;
}

.table-switch input {
  position: absolute;
  opacity: 0;
}

.table-switch span {
  position: relative;
  width: 28px;
  height: 16px;
  border-radius: 8px;
  background: #b9c0bb;
  transition: background 140ms ease;
}

.table-switch span::after {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  content: "";
  transition: transform 140ms ease;
}

.table-switch input:checked + span {
  background: var(--green);
}

.table-switch input:checked + span::after {
  transform: translateX(12px);
}

.table-empty {
  padding: 24px;
  color: var(--text-muted);
  text-align: center;
}

.relationship-editor {

.member-selector span {

.member-selector select {

}

.branch-selector label {

  flex: 1 1 auto;

}

.branch-selector label span,
.branch-selector > strong {
  flex: 0 0 auto;

}

.branch-selector select {

  height: 29px;
  flex: 1 1 auto;

.editor-section--base .form-grid,

.chain-heading span {

}

.chain-heading strong {

.chain-node small {

.chain-node strong {

.chain-arrow {

.condition-mode-row,

.condition-mode-row .editor-field {

.condition-list,
.action-list,

.condition-row,
.action-row {

.input-source-row,

.calculation-item strong,

.calculation-item small {
