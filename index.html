<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>穿搭推荐案例运行</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="rules-data.js"></script>
  <script defer src="rule-engine.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="demo-page">
  <header class="app-header">
    <a class="brand" href="index.html" aria-label="穿搭推荐首页">
      <span class="brand-mark" aria-hidden="true">衣</span>
      <span>
        <strong>穿搭推荐</strong>
        <small>案例运行</small>
      </span>
    </a>

    <nav class="page-nav" aria-label="页面导航">
      <a class="is-active" href="index.html">案例运行</a>
      <a href="rules.html">规则管理</a>
    </nav>

    <div class="header-actions">
      <span class="version-chip" id="ruleVersion">规则 0.9.0</span>
      <button class="icon-button" id="resetInputButton" type="button" title="恢复默认输入" aria-label="恢复默认输入">↺</button>
    </div>
  </header>

  <main class="demo-main">
    <section class="demo-top-grid" aria-label="本次条件与分析方向">
      <section class="surface input-surface">
        <div class="surface-header">
          <div>
            <p class="section-kicker">01 本次输入</p>
            <h1>确认本次条件</h1>
          </div>
          <span class="source-badge">客户确认</span>
        </div>

        <nav class="input-tabs" id="inputTabs" aria-label="输入分组"></nav>
        <div class="input-content" id="inputContent"></div>
      </section>

      <section class="surface analysis-surface">
        <div class="surface-header analysis-header">
          <div>
            <p class="section-kicker">02 本次影响</p>
            <h2>输入会改变什么</h2>
          </div>
          <span class="calculation-state" id="calculationState">已更新</span>
        </div>

        <div class="analysis-trace-list" id="analysisTrace"></div>
      </section>
    </section>

    <section class="recommendation-section" aria-labelledby="recommendationTitle">
      <div class="recommendation-heading">
        <div>
          <p class="section-kicker">03 完整方案</p>
          <h2 id="recommendationTitle">完整穿着方案</h2>
        </div>
        <p id="candidateSummary">根据当前规则生成 3 个不同方向</p>
      </div>

      <div class="candidate-grid" id="candidateGrid"></div>
      <div class="empty-result" id="emptyResult" hidden></div>
    </section>
  </main>

  <dialog class="detail-dialog" id="candidateDialog">
    <div class="dialog-header">
      <div>
        <p class="section-kicker">方案详情</p>
        <h2 id="dialogTitle">完整方案</h2>
      </div>
      <button class="icon-button" type="button" data-close-dialog title="关闭" aria-label="关闭">×</button>
    </div>
    <div id="dialogContent"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
