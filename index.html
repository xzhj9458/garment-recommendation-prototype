<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>穿搭推荐案例运行</title>
  <link rel="stylesheet" href="styles.css?v=logic-3.0-p11">
  <script defer src="rules-data.js?v=logic-3.0-p11"></script>
  <script defer src="canonical-data.js?v=logic-3.0-p11"></script>
  <script defer src="canonical-input-adapter.js?v=logic-3.0-p11"></script>
  <script defer src="canonical-rule-engine.js?v=logic-3.0-p11"></script>
  <script defer src="canonical-output-adapter.js?v=logic-3.0-p11"></script>
  <script defer src="v3-runtime.js?v=logic-3.0-p11"></script>
  <script defer src="v3-prototype-adapter.js?v=logic-3.0-p11"></script>
  <script defer src="rule-engine.js?v=logic-3.0-p11"></script>
  <script defer src="app.js?v=logic-3.0-p11"></script>
</head>
<body class="demo-page">
  <header class="app-header">
    <a class="brand" href="index.html" aria-label="穿搭推荐首页">
      <span class="brand-mark" aria-hidden="true">衣</span>
      <span>
        <strong>穿搭推荐</strong>
        <small>案例运行</small>
      </span>
    </a>

    <nav class="page-nav" aria-label="页面导航">
      <a class="is-active" href="index.html">案例运行</a>
      <a href="rules.html">规则管理</a>
    </nav>

    <div class="header-actions">
      <div class="engine-mode-bar" id="engineModeBar" role="radiogroup" aria-label="推荐规则版本">
        <button class="engine-mode-button" type="button" role="radio" aria-checked="false" data-engine-mode="v2">旧版回退</button>
        <button class="engine-mode-button is-active" type="button" role="radio" aria-checked="true" data-engine-mode="v3">效果等价</button>
      </div>
      <span class="version-chip" id="ruleVersion">规则 0.9.0</span>
      <button class="icon-button" id="resetInputButton" type="button" title="恢复默认输入" aria-label="恢复默认输入">↺</button>
    </div>
  </header>

  <main class="demo-main">
    <section class="demo-column demo-column-input">
      <div class="module-heading module-heading--input">
        <div>
          <h1>01 本次条件</h1>
        </div>
        <span class="source-badge">客户确认</span>
      </div>

      <aside class="surface input-surface" aria-label="本次输入条件">
        <div class="input-sticky-header" id="inputStickyHeader">
          <div class="condition-snapshot" id="conditionSnapshot" aria-label="已选输入概览"></div>
          <nav class="input-tabs" id="inputTabs" aria-label="输入分组"></nav>
        </div>
        <div class="input-content" id="inputContent"></div>
      </aside>
    </section>

    <section class="demo-column demo-column-results">
      <div class="module-heading recommendation-heading">
        <div>
          <h2 id="recommendationTitle">02 完整方案</h2>
        </div>
        <div class="recommendation-heading-controls">
          <p id="candidateSummary">根据当前规则生成 3 个不同方向</p>
          <div class="hair-style-control" aria-label="效果图发型">
            <span>发型</span>
            <div class="hair-style-bar" id="hairStyleBar" role="radiogroup" aria-label="效果图通用发型">
              <button class="hair-style-button is-active" type="button" role="radio" aria-checked="true" data-hair-style="short">短发</button>
              <button class="hair-style-button" type="button" role="radio" aria-checked="false" data-hair-style="medium">中长发</button>
              <button class="hair-style-button" type="button" role="radio" aria-checked="false" data-hair-style="long">长发</button>
            </div>
          </div>
          <div class="view-mode-bar" id="viewModeBar" role="group" aria-label="方案视图模式">
            <button class="view-mode-button is-active" type="button" data-view-mode="cards" title="卡片视图">▣ 卡片对比</button>
            <button class="view-mode-button" type="button" data-view-mode="table" title="多维属性对比表">☷ 属性对比表</button>
          </div>
        </div>
      </div>

      <section class="recommendation-section" aria-labelledby="recommendationTitle">
      <div class="candidate-grid" id="candidateGrid"></div>
      <div class="candidate-table-wrap" id="candidateTableView" hidden></div>
      <div class="empty-result" id="emptyResult" hidden></div>
      </section>
    </section>
  </main>

  <dialog class="detail-dialog" id="candidateDialog">
    <div class="dialog-header">
      <div>
        <p class="section-kicker" id="dialogCandidateName">方案详情与落地依据</p>
        <h2 id="dialogCandidateTitle">完整方案</h2>
      </div>
      <button class="icon-button" type="button" data-close-dialog title="关闭" aria-label="关闭">×</button>
    </div>
    <div id="candidateDetailContent"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
